name: Refresh Request Center system map

on:
  push:
    branches: [ feature/request-center-module-1.62.88 ]
    paths:
      - 'request-center.php'
      - 'modules/request-center/**'
      - 'index.php'
      - 'actions/ticket-actions.php'
      - 'actions/supervisor-actions.php'
      - 'actions/bulk-actions.php'
      - 'cron/ticket_auto_close.php'
      - 'tests/test_request_center_*.php'
      - 'tests/test_request_center_*.py'
      - 'tests/test_ticket_*static.py'
      - 'tests/test_ldap_secret_and_legacy_status_static.py'
      - '.github/workflows/refresh-request-center-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: request-center-map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/request-center-module-1.62.88
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest
      - name: Regenerate machine-readable maps
        run: |
          python3 tools/build_system_map.py
          php tools/code_index.php > docs/system-map/BLOCKS.json
          python3 tools/topic_index.py
          python3 tools/render_code_map.py
      - name: Verify generated maps
        run: |
          python3 tools/build_system_map.py --check
          python3 tests/test_system_map_static.py
          python3 -m pytest -q tests/test_system_map_blocks.py
      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/system-map/FILES.tsv docs/system-map/SYMBOLS.tsv docs/system-map/ROUTES.tsv docs/system-map/TABLES.tsv docs/system-map/UPDATES.tsv docs/system-map/FEATURES.tsv docs/system-map/summary.json docs/system-map/BLOCKS.json docs/system-map/TOPICS.json docs/system-map/REVIEW-MAP-FA.md
          if git diff --cached --quiet; then
            echo "System map is already current."
          else
            git commit -m "docs(system-map): refresh generated indexes for Request Center branch"
            git push origin HEAD:feature/request-center-module-1.62.88
          fi
