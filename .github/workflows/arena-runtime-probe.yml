name: Arena PHP/MariaDB runtime bundle

# Temporary build channel: the sandbox can only reach github.com / api.github.com /
# pypi.org / registry.npmjs.org, so real Debian 12 PHP 8.2 + MariaDB 10.11 .deb
# packages are resolved on a runner and shipped back through this branch.
on:
  push:
    branches: [ arena/dacdd8a7-ticket ]
    paths: [ .arena-runtime/trigger.txt ]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
      options: --user root
    env:
      REPO: ${{ github.repository }}
      BRANCH: arena/dacdd8a7-ticket
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Base tooling
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl xz-utils python3-minimal
          dpkg-query -W -f='${Package} ${Version}\n' | sort > /tmp/before.txt

      - name: Install real PHP 8.2 + MariaDB
        run: |
          set -euxo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mariadb-server mariadb-client \
            php8.2-cli php8.2-common php8.2-mysql php8.2-sqlite3 php8.2-mbstring \
            php8.2-xml php8.2-zip php8.2-curl php8.2-ldap php8.2-gd php8.2-intl php8.2-bcmath
          php -v
          php -m | sort
          mariadbd --version

      - name: Fetch sandbox installed-package list
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/local-installed.txt \
            "https://raw.githubusercontent.com/${REPO}/${BRANCH}/.arena-runtime/installed.txt"
          wc -l /tmp/local-installed.txt

      - name: Download only packages missing/outdated in the sandbox
        run: |
          set -euxo pipefail
          dpkg-query -W -f='${Package} ${Version}\n' | sort > /tmp/after.txt
          python3 - <<'PY'
          def load(path):
              out = {}
              for line in open(path, encoding='utf-8'):
                  parts = line.rstrip('\n').split(' ', 1)
                  if len(parts) == 2:
                      out[parts[0]] = parts[1]
              return out
          before = load('/tmp/before.txt')
          after = load('/tmp/after.txt')
          local = load('/tmp/local-installed.txt')
          changed = {k: v for k, v in after.items() if before.get(k) != v}
          needed = sorted(k for k, v in changed.items() if local.get(k) != v)
          with open('/tmp/needed.txt', 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(needed) + '\n')
          with open('/tmp/MANIFEST.txt', 'w', encoding='utf-8') as fh:
              fh.write('Debian 12 (bookworm) PHP 8.2 + MariaDB runtime packages\n')
              fh.write('sandbox packages: %d | runner packages: %d | changed by install: %d | shipped: %d\n'
                       % (len(local), len(after), len(changed), len(needed)))
              for name in needed:
                  fh.write('%s %s\n' % (name, changed[name]))
          print('shipping %d packages' % len(needed))
          PY
          mkdir -p /tmp/payload/debs && cd /tmp/payload/debs
          xargs -r apt-get download < /tmp/needed.txt
          cp /tmp/MANIFEST.txt /tmp/payload/MANIFEST.txt
          du -sh /tmp/payload/debs
          ls /tmp/payload/debs | wc -l

      - name: Pack, split and push through git
        run: |
          set -euxo pipefail
          cd /tmp/payload
          sha256sum debs/*.deb > SHA256SUMS
          tar -cf /tmp/runtime.tar -C /tmp/payload .
          sha256sum /tmp/runtime.tar > /tmp/runtime.sha256
          cp /tmp/runtime.sha256 /tmp/payload/RUNTIME-SHA256.txt
          rm -f /tmp/part-*
          split -b 40m /tmp/runtime.tar /tmp/part-
          ls -la /tmp/part-* | awk '{print $9, $5}'
          git clone --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${TOKEN}@github.com/${REPO}.git" /tmp/repo
          cd /tmp/repo
          mkdir -p .arena-runtime/parts
          cp /tmp/part-* .arena-runtime/parts/
          cp /tmp/MANIFEST.txt .arena-runtime/MANIFEST.txt
          cp /tmp/runtime.sha256 .arena-runtime/RUNTIME-SHA256.txt
          printf 'parts=%s\nsize=%s\n' \
            "$(find /tmp -maxdepth 1 -name 'part-*' | wc -l)" \
            "$(stat -c %s /tmp/runtime.tar)" > .arena-runtime/PARTS.txt
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add .arena-runtime/parts .arena-runtime/MANIFEST.txt .arena-runtime/PARTS.txt .arena-runtime/RUNTIME-SHA256.txt
          git commit -m "chore: temporary PHP/MariaDB runtime bundle"
          git push origin "HEAD:${BRANCH}"
