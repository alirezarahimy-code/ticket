name: Refresh System Map

on:
  push:
    branches: [ feature/request-center-module-1.62.88 ]
    paths-ignore:
      - 'docs/system-map/**'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate source maps and topic index
        run: |
          python tools/build_system_map.py
          php tools/code_index.php > docs/system-map/BLOCKS.json
          python tools/topic_index.py
          python tools/render_code_map.py
      - name: Validate regenerated maps
        run: |
          python tests/test_system_map_static.py
          python -m pytest -q tests/test_system_map_blocks.py tests/test_topic_index_integrity.py
      - name: Commit generated indexes to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/system-map
          if git diff --cached --quiet; then
            echo "System map is already current."
            exit 0
          fi
          git commit -m "chore(system-map): refresh indexes for Request Center slice"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
