# نگهبان سامانهٔ لاگ‌گیری مرکزی.
# این گردش‌کار سبک است و فقط قرارداد ایستای لاگ را بررسی می‌کند تا هیچ
# به‌روزرسانی‌ای فایل‌ها، مهاجرت‌ها یا قابلیت‌های لاگ را حذف نکند.
name: Logging contract

on:
  push:
    branches: ['**']
    tags: ['v1.62.88']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Verify the central logging contract
        run: python -m pytest -q tests/test_logging_system_contract.py
      # Rebuild the release archive from this checkout before comparing repository bytes.
      - name: Rebuild 1.62.88 package before source-of-truth guard
        if: github.ref == 'refs/tags/v1.62.88'
        run: python tools/build_update_1_62_88.py
      # Keeps the repository and the shipped update package byte-identical.
      # Nothing else in CI runs this guard, so a package could silently drift.
      - name: Verify release packages, checksums and source-of-truth
        run: python -m pytest -q tests/test_version_source_of_truth_static.py tests/test_release_chain_integrity.py
