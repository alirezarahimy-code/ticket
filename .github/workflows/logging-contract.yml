# نگهبان سامانهٔ لاگ‌گیری مرکزی.
# این گردش‌کار سبک است و فقط قرارداد ایستای لاگ را بررسی می‌کند تا هیچ
# به‌روزرسانی‌ای فایل‌ها، مهاجرت‌ها یا قابلیت‌های لاگ را حذف نکند.
name: Logging contract

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Verify the central logging contract
        run: python -m pytest -q tests/test_logging_system_contract.py
      # Keeps the repository and the shipped update package byte-identical.
      # Nothing else in CI runs this guard, so a package could silently drift.
      - name: Verify the repository matches the shipped package
        run: python -m pytest -q tests/test_version_source_of_truth_static.py
