# نگهبان سامانهٔ لاگ‌گیری مرکزی.
# این گردش‌کار سبک است و فقط قرارداد ایستای لاگ را بررسی می‌کند تا هیچ
# به‌روزرسانی‌ای فایل‌ها، مهاجرت‌ها یا قابلیت‌های لاگ را حذف نکند.
name: Logging contract

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Verify the central logging contract
        run: python -m pytest -q tests/test_logging_system_contract.py
      # The legacy source-of-truth guard is specific to the 1.62.88 archive.
      # Newer release trains have their own package-preview workflows; never run
      # a hard-coded 1.62.88 builder against a different VERSION (for example 1.63).
      - name: Read application version
        id: app-version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Rebuild 1.62.88 package before source-of-truth guard
        if: steps.app-version.outputs.value == '1.62.88'
        run: python tools/build_update_1_62_88.py
      # Keeps the 1.62.88 repository and shipped archive byte-identical.
      - name: Verify the repository matches the shipped package
        if: steps.app-version.outputs.value == '1.62.88'
        run: python -m pytest -q tests/test_version_source_of_truth_static.py
