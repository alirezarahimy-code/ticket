# نگهبان سامانهٔ لاگ‌گیری مرکزی.
# این گردش‌کار سبک است و فقط قرارداد ایستای لاگ را بررسی می‌کند تا هیچ
# به‌روزرسانی‌ای فایل‌ها، مهاجرت‌ها یا قابلیت‌های لاگ را حذف نکند.
name: Logging contract

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Verify the central logging contract
        run: python -m pytest -q tests/test_logging_system_contract.py
      # نسخه‌های الحاقی اتحاد با SHA‑256 پین‌شده داخل مخزن هستند؛ به‌جای بازساخت بستهٔ کلاسیک ۱٫۶۲٫۸۸
      # همان بسته‌ها (هستهٔ تحویل ۱٫۶۲٫۹۵) تأیید می‌شوند و سپس نگهبان منبع-حقیقت اجرا می‌شود.
      - name: Verify pinned 1.62.93/1.62.94/1.62.95 union packages
        run: |
          cd downloads
          sha256sum -c ticket-update-1.62.90-to-1.62.93-food-reconciliation-leftover-20261106.zip.sha256
          sha256sum -c ticket-update-1.62.93-to-1.62.94-food-guest-org-holiday-20261110.zip.sha256
          sha256sum -c ticket-update-1.62.94-to-1.62.95-food-auto-receipts-cddvd-20261111.zip.sha256
          unzip -t ticket-update-1.62.90-to-1.62.93-food-reconciliation-leftover-20261106.zip
          unzip -t ticket-update-1.62.93-to-1.62.94-food-guest-org-holiday-20261110.zip
          unzip -t ticket-update-1.62.94-to-1.62.95-food-auto-receipts-cddvd-20261111.zip
      # Keeps the repository and the shipped update package byte-identical.
      # Nothing else in CI runs this guard, so a package could silently drift.
      - name: Verify the repository matches the shipped package
        run: python -m pytest -q tests/test_version_source_of_truth_static.py
