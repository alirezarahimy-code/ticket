# نگهبان سامانهٔ لاگ‌گیری مرکزی.
# قرارداد Logging روی همهٔ شاخه‌ها اجرا می‌شود؛ اعتبارسنجی بستهٔ کلاسیک
# ۱٫۶۲٫۸۸ فقط روی همان نسخه انجام می‌شود، چون سازندهٔ آن VERSION را قفل می‌کند.
name: Logging contract

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Verify the central logging contract
        run: python -m pytest -q tests/test_logging_system_contract.py
      - name: Read application version
        id: app-version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      # This builder and its byte-for-byte guard belong only to the 1.62.88 release.
      # Newer release trains validate their own pinned packages in their package-preview workflow.
      - name: Rebuild 1.62.88 package before source-of-truth guard
        if: steps.app-version.outputs.value == '1.62.88'
        run: python tools/build_update_1_62_88.py
      - name: Verify the repository matches the shipped package
        if: steps.app-version.outputs.value == '1.62.88'
        run: python -m pytest -q tests/test_version_source_of_truth_static.py
