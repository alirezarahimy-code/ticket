name: Publish release assets

# هدف: ساخت Release واقعی با فایل‌های پیوست، از داخل زیرساخت گیت‌هاب.
# چرا: آپلود مستقیم از محیط توسعه به uploads.github.com مسدود است،
# ولی runner خودِ گیت‌هاب به آن دسترسی دارد.
#
# چرا trigger با tag و نه workflow_dispatch؟
#   workflow_dispatch فقط روی شاخهٔ پیش‌فرض (main) در دسترس است و اجرا نمی‌شود
#   اگر فایل workflow روی main نباشد. برای رویداد push، گیت‌هاب فایل
#   workflow را از همان refی می‌خواند که push شده — پس با زدن یک tag روی
#   شاخهٔ کاری، این workflow بدون نیاز به main اجرا می‌شود.
#
# اجرا:
#   git tag publish-1.62.97 <sha>
#   git push origin publish-1.62.97
#
#   متغیرهای اختیاری از طریق commit message یا پیش‌فرض‌ها تعیین می‌شوند.

on:
  push:
    tags:
      - 'publish-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'برچسب نسخه (مثلاً v1.62.97)'
        required: true
        default: 'v1.62.97'
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: تعیین برچسب Release
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            # publish-1.62.97  →  v1.62.97
            PUSHED="${GITHUB_REF_NAME}"
            RELEASE_TAG="v${PUSHED#publish-}"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "برچسب Release: $RELEASE_TAG"

      - name: فهرست فایل‌های پیوست
        run: |
          echo "── فایل‌های موجود ──"
          ls -la downloads/*.zip
          echo "── checksum ها ──"
          cat downloads/*.sha256

      - name: بررسی سالم بودن فایل‌های این نسخه
        run: |
          set -euo pipefail
          # فقط سه فایل این نسخه بررسی می‌شوند. پوشهٔ downloads/ بسته‌های
          # تاریخی هم دارد که بعضی‌شان ناقص‌اند و نباید در این دروازه دخالت کنند.
          fail=0
          for pair in \
            "ticket-full-1.62.97-20261116.zip" \
            "ticket-update-1.62.96-to-1.62.97-food-worker-selftest-panel-20261115.zip" \
            "ticket-update-1_62_96-to-1_63-request-center-rc-candidate-20261114-r16.zip"
          do
            path="downloads/$pair"
            sc="$path.sha256"
            if [ ! -f "$path" ]; then
              echo "::error::فایل نیست: $path"
              fail=1
              continue
            fi
            if [ ! -f "$sc" ]; then
              echo "::error::checksum نیست: $sc"
              fail=1
              continue
            fi
            expected=$(awk '{print $1}' "$sc")
            actual=$(sha256sum "$path" | awk '{print $1}')
            size=$(stat -c%s "$path")
            if [ "$actual" != "$expected" ]; then
              echo "::error::SHA-256 نمی‌خواند: $pair"
              echo "  انتظار: $expected"
              echo "  واقعی : $actual"
              fail=1
            else
              echo "✓ $pair  ($size بایت)"
              echo "  $actual"
            fi
          done
          exit $fail

      - name: ساخت Release و پیوست فایل‌ها
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.cfg.outputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          NOTES="downloads/RELEASE-NOTES.md"
          if [ ! -f "$NOTES" ]; then
            echo "یادداشت نسخه نیست؛ از متن پیش‌فرض استفاده می‌شود."
            printf 'بستهٔ %s\n' "$RELEASE_TAG" > /tmp/notes.md
            NOTES=/tmp/notes.md
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release «$RELEASE_TAG» از قبل هست — فایل‌ها به‌روزرسانی می‌شوند."
            gh release upload "$RELEASE_TAG" downloads/*.zip --clobber
          else
            echo "ساخت Release «$RELEASE_TAG»…"
            gh release create "$RELEASE_TAG" \
              --title "نسخهٔ ۱.۶۲.۹۷ — کارت آزمون جامع و اصلاح هشدار مهاجرت" \
              --notes-file "$NOTES" \
              --target "$TARGET_SHA" \
              downloads/*.zip
          fi

      - name: گزارش لینک‌های مستقیم
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.cfg.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          REPO="${GITHUB_REPOSITORY}"
          {
            echo "## لینک‌های دانلود مستقیم"
            echo ""
            for f in downloads/*.zip; do
              name=$(basename "$f")
              url="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${name}"
              echo "- \`$name\`"
              echo ""
              echo "  <$url>"
              echo ""
            done
            echo "صفحهٔ Release: https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
