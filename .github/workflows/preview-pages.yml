name: انتشار پیشنمایش غایبین روی GitHub Pages

on:
  push:
    branches: [arena/dacdd8a7-ticket]
    paths:
      - 'docs/previews/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages (فعالسازی در صورت نیاز)
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ github.token }}
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/previews
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
