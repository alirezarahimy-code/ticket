name: Offline map module contract

on:
  push:
    branches:
      - feature/offline-national-gis-map
    paths:
      - 'offline-map.php'
      - 'modules/offline-map/**'
      - 'permissions.php'
      - 'lib/render.php'
      - 'schema.sql'
      - 'install-empty-db.sql'
      - 'migrations/038-offline-map-features.sql'
      - 'migrations/039-offline-map-attachments.sql'
      - 'tests/test_offline_map_module_static.py'
      - 'tools/test_schema_baseline_offline.php'
      - '.github/workflows/offline-map-contract.yml'
  pull_request:
    paths:
      - 'offline-map.php'
      - 'modules/offline-map/**'
      - 'permissions.php'
      - 'lib/render.php'
      - 'schema.sql'
      - 'install-empty-db.sql'
      - 'migrations/038-offline-map-features.sql'
      - 'tests/test_offline_map_module_static.py'
      - 'tools/test_schema_baseline_offline.php'
      - '.github/workflows/offline-map-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: PHP syntax checks
        run: |
          php -l offline-map.php
          php -l modules/offline-map/MapRepository.php
          php -l modules/offline-map/Pages/index.php
          node --check modules/offline-map/Assets/offline-map.js
      - name: Offline map static contract
        run: python -m pytest -q tests/test_offline_map_module_static.py
      - name: Fresh-install schema baseline
        run: php tools/test_schema_baseline_offline.php
