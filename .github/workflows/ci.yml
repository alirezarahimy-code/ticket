name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # دیتابیس واقعی برای آزمون یکپارچگی نصب تازه و مهاجرت‌ها — فقط همین job و فقط ephemeral.
      # نکته: مهاجرت‌های پروژه با سینتکس MariaDB نوشته شده‌اند (ADD COLUMN IF NOT EXISTS)
      # و روی MySQL 8 شکست می‌خورند؛ به همین دلیل تصویر mariadb انتخاب شده است.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-ephemeral-root-password
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: persian_ticketing_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pci-ephemeral-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_mysql, ldap, mbstring, xml, zip
        coverage: none

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python test runner
      run: python -m pip install --disable-pip-version-check pytest

    # تستهای نگهبان بوت جلسه: مانیفست مهارتها، نقشهٔ سامانه و دکمهٔ استارت.
    # جلوگیری از پوسیدن docs/SKILL-MANIFEST-FA.md و docs/system-map با هر کامیت.
    # اسکریپتها خروجی exit-code دارند و pytest برایشان جمعکننده نیست؛ مستقیم اجرا میشوند.
    - name: Session boot guard tests
      run: |
        python tests/test_skill_manifest_static.py
        python tests/test_system_map_static.py
        python tests/test_session_boot_static.py

    # ─── یکپارچگی واقعی دیتابیس (MariaDB) ───────────────────────────────
    # اسکیمای نصب تازه (install-empty-db.sql، ۸۲ جدول) روی MariaDB واقعی بارگذاری
    # می‌شود و سپس همهٔ مهاجرت‌ها (به‌جز فایل *-rollback.sql) دوبار اعمال می‌شوند
    # تا ایده‌مپوتنسی تأیید شود. هیچ دادهٔ واقعی درگیر نیست.
    - name: Install MariaDB client
      run: sudo apt-get update && sudo apt-get install -y mariadb-client

    - name: Wait for MariaDB
      run: |
        for i in $(seq 1 60); do
          mariadb-admin ping -h 127.0.0.1 -uroot -pci-ephemeral-root-password --silent && exit 0
          sleep 2
        done
        echo "MariaDB آماده نشد" >&2
        exit 1

    - name: Load fresh-install schema
      run: mariadb -h 127.0.0.1 -uroot -pci-ephemeral-root-password persian_ticketing_ci < install-empty-db.sql

    - name: Fresh install integrity (PDO)
      run: php tests/test_mariadb_fresh_install.php fresh-install
      env:
        CI_DB_HOST: 127.0.0.1
        CI_DB_PORT: '3306'
        CI_DB_NAME: persian_ticketing_ci
        CI_DB_USER: root
        CI_DB_PASS: ci-ephemeral-root-password
        CI_DB_REQUIRED: '1'

    - name: Apply all migrations twice (idempotency)
      run: |
        set -e
        for pass in 1 2; do
          echo "── migration pass $pass"
          for f in $(ls migrations/*.sql | grep -v -- '-rollback.sql' | LC_ALL=C sort); do
            echo "→ $f"
            mariadb -h 127.0.0.1 -uroot -pci-ephemeral-root-password persian_ticketing_ci < "$f"
          done
        done

    - name: Migration registry integrity
      run: php tests/test_mariadb_fresh_install.php migrations-applied
      env:
        CI_DB_HOST: 127.0.0.1
        CI_DB_PORT: '3306'
        CI_DB_NAME: persian_ticketing_ci
        CI_DB_USER: root
        CI_DB_PASS: ci-ephemeral-root-password
        CI_DB_REQUIRED: '1'

    - name: Check PHP syntax
      run: git ls-files -z -- '*.php' | php tools/lint-php-syntax.php

    # ممیزی سلامت سامانه. روی سرور از دل cron/check_logging_health.php اجرا
    # می‌شود و در سیستم لاگ ثبت می‌گردد؛ اینجا با --no-db فقط بررسی‌هایی که
    # به پایگاه داده نیاز ندارند اجرا می‌شوند تا نقص زودتر از ادغام دیده شود.
    - name: System health audit
      run: php tools/system_audit.php --no-db --check

    - name: Run security tests
      run: php tests/SecurityTest.php

    - name: Run architecture tests
      run: php tests/ArchitectureTest.php

    - name: Run ticket routing unit tests
      run: php tests/test_ticket_routing_unit.php

    - name: Run ticket SLA unit tests
      run: php tests/test_ticket_sla_unit.php

    - name: Run guest order personal scope tests
      run: php tests/test_food_guest_personal_scope.php

    - name: Run food module grant boundary tests
      run: php tools/test_module_grant_offline.php

    - name: Run standalone worker logic tests
      run: php tests/test_food_ticket_logic.php

    - name: Run food worker window tests
      run: php tests/test_food_worker_window.php

    - name: Run system update prerequisite tests
      run: php tests/test_system_update_requires_version.php

    - name: Run Logging migration registry regression test
      run: php tests/test_logging_audit_migration_registry.php

    - name: Run backup upload restore archive security tests
      run: php tests/test_backup_restore_archive.php

    - name: Run system update archive path safety tests
      run: php tests/test_system_update_archive_paths.php

    - name: Run cross-version migration registry test
      run: php tests/test_system_update_migration_registry.php

    - name: Run asset scope permission tests
      run: php tests/test_asset_scope_permissions.php

    - name: Run offline permission coverage test
      run: php tools/test_access_coverage_offline.php

    - name: Run offline ticket transaction regression test
      run: php tools/test_ticket_txn_offline.php

    - name: Run system update ZIP entry behavioral tests
      run: php tests/test_system_update_archive_zip.php

    - name: Run update and Windows acceptance static contracts
      run: python -m pytest -q tests/test_update_manifest_guard_static.py tests/test_windows_logging_static.py tests/test_migration_registry_seed.py tests/test_backup_restore_static.py tests/test_route_security_static.py

    - name: Verify fresh-install schema parity
      run: python -m pytest -q tests/test_fresh_install_schema_parity.py

    - name: Compile update packagers
      run: python -m py_compile tools/build_cumulative_update.py tools/build_update_1_62_88.py

    - name: Test 1.62.88 package builder contracts
      run: python -m pytest -q tests/test_release_1_62_88_package_integrity.py

    - name: Build and verify 1.62.88 update archive
      run: |
        python tools/build_update_1_62_88.py
        cd downloads
        sha256sum -c ticket-update-1.62.82-to-1.62.88-merged-20261105.zip.sha256
        unzip -t ticket-update-1.62.82-to-1.62.88-merged-20261105.zip

    - name: Upload verified 1.62.88 update archive
      uses: actions/upload-artifact@v4
      with:
        name: ticket-update-1.62.82-to-1.62.88-verified
        path: |
          downloads/ticket-update-1.62.82-to-1.62.88-merged-20261105.zip
          downloads/ticket-update-1.62.82-to-1.62.88-merged-20261105.zip.sha256
        if-no-files-found: error
