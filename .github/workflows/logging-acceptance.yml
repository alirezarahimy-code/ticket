name: Logging 1.62.88 Acceptance

# اجرای PR فقط از دیتابیس MariaDB دورریختنی و پوشه‌های موقت Windows استفاده می‌کند.
# بررسی‌های عملیاتی Staging همچنان دستی و با RunOperational اجرا می‌شوند.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  linux-mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: itsm_logging_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, zip
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: PHP syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './updates/*' -not -path './vendor/*' \
            -not -path './release-archive/*' -not -path './backup/*' -print0 |
            while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done
      - name: Offline PHP Logging tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_logging_*.php; do
            if [[ "$test" == 'tests/test_logging_mysql_integration.php' ]]; then continue; fi
            php "$test"
          done
      - name: MySQL/MariaDB integration tests (dedicated disposable database)
        env:
          ITSM_TEST_ALLOW_DESTRUCTIVE: 'YES'
          ITSM_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=itsm_logging_test;charset=utf8mb4'
          ITSM_TEST_DB_USER: root
          ITSM_TEST_DB_PASS: test-root-password
        run: php tests/test_logging_mysql_integration.php
      - name: Python Logging/static contract tests
        run: >-
          python -m pytest -q
          tests/test_logging_*.py
          tests/test_windows_logging_static.py
          tests/test_update_manifest_guard_static.py

  windows-acl-and-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, zip
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: PHP syntax and offline Logging tests
        shell: pwsh
        run: |
          $env:PHP_EXE = (Get-Command php.exe).Source
          $env:PYTHON_EXE = (Get-Command python.exe).Source
          & .\tests\run_logging_staging_checks.ps1
      - name: Real Windows NTFS ACL verifier test
        shell: powershell
        run: .\tests\test_logging_acl_windows.ps1

  build-1-62-88-update:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [linux-mariadb-integration, windows-acl-and-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, zip
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package validation test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Gate legacy 1.62.88 package build by VERSION
        id: legacy_package
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$version" == "1.62.88" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "SKIP: VERSION is $version; the 1.62.88 package builder is release-specific."
          fi
      - name: Build and validate cumulative update package
        if: steps.legacy_package.outputs.build == 'true'
        run: |
          python -m py_compile tools/build_update_1_62_88.py
          python tools/build_update_1_62_88.py
          python -m pytest -q \
            tests/test_version_source_of_truth_static.py \
            tests/test_migration_registry_seed.py \
            tests/test_fresh_install_schema_parity.py \
            tests/test_backup_restore_static.py \
            tests/test_update_manifest_guard_static.py
          php tests/test_system_update_archive_zip.php
          php tests/test_system_update_migration_registry.php
          php tests/test_backup_restore_archive.php
      - uses: actions/upload-artifact@v4
        if: steps.legacy_package.outputs.build == 'true'
        with:
          name: ticket-update-1.62.88-verified
          path: |
            downloads/ticket-update-1.62.82-to-1.62.88-merged-20261105.zip
            downloads/ticket-update-1.62.82-to-1.62.88-merged-20261105.zip.sha256
            downloads/CHANGE-REPORT-FA-1.62.88.md
          if-no-files-found: error
          retention-days: 30
