name: Request Center QA Package Preview

on:
  push:
    branches: [ feature/request-center-module-1.62.88, arena/22d4eba7-ticket ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-center-package-preview
  cancel-in-progress: false

jobs:
  package-preview:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4.32
        env:
          MARIADB_ROOT_PASSWORD: ci-ephemeral-root-password
          MARIADB_DATABASE: persian_ticketing_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/request-center-module-1.62.88
          fetch-depth: 0

      - name: Setup PHP and Python
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mbstring, xml, zip
          coverage: none

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Verify target MariaDB version before schema import
        run: |
          actual=$(mariadb --skip-ssl -h 127.0.0.1 -uroot -pci-ephemeral-root-password -Nse 'SELECT VERSION()')
          echo "MariaDB server version: ${actual}"
          case "${actual}" in
            "10.4.32"*) ;;
            *) echo "Expected MariaDB 10.4.32, got ${actual}"; exit 1 ;;
          esac

      - name: PHP syntax checks
        run: |
          php -l request-center.php
          php -l modules/request-center/Pages/index.php
          php -l modules/request-center/Pages/calendar.php
          php -l modules/request-center/RequestCenterRepository.php
          php -l modules/request-center/WorkflowService.php
          php -l modules/request-center/AppointmentRepository.php
          php -l modules/request-center/Actions/appointment-actions.php

      - name: Request Center static and SQLite contracts
        run: |
          python -m pytest -q tests/test_request_center_first_slice_static.py tests/test_request_center_access_matrix_static.py
          php tests/test_request_center_repository_sqlite.php
          php tests/test_request_center_workflow_service_sqlite.php
          php tests/test_request_center_appointments_sqlite.php

      - name: Load disposable fresh-install schema
        run: mariadb --skip-ssl -h 127.0.0.1 -uroot -pci-ephemeral-root-password persian_ticketing_ci < install-empty-db.sql

      - name: Request Center MariaDB schema preflight
        run: php tests/test_request_center_schema_preflight_mariadb.php
        env:
          CI_DB_HOST: 127.0.0.1
          CI_DB_PORT: '3306'
          CI_DB_NAME: persian_ticketing_ci
          CI_DB_USER: root
          CI_DB_PASS: ci-ephemeral-root-password

      - name: Existing ticket workflow regression contracts
        run: |
          python -m pytest -q tests/test_ticket_workflow_safety_static.py tests/test_ticket_cancellation_static.py tests/test_ticket_three_views_static.py tests/test_ticket_lifecycle_guide_static.py tests/test_ldap_secret_and_legacy_status_static.py
          php tests/test_ticket_routing_unit.php

      - name: Verify package baseline and required source files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="ab073ee9fffc56ccd1a2093d02725b95891e0d63"
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git merge-base "${BASE_SHA}" HEAD)" = "${BASE_SHA}"
          for file in \
            index.php \
            request-center.php \
            actions/ticket-actions.php \
            actions/supervisor-actions.php \
            actions/bulk-actions.php \
            cron/ticket_auto_close.php \
            modules/request-center/Pages/index.php \
            modules/request-center/RequestCenterRepository.php \
            modules/request-center/WorkflowService.php \
            modules/request-center/Actions/ticket-actions.php \
            modules/request-center/Actions/supervisor-actions.php \
            modules/request-center/Actions/bulk-actions.php \
            docs/architecture/REQUEST-CENTER-ARCHITECTURE.md
          do
            test -s "$file"
          done

      - name: Assemble isolated QA overlay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="dist/request-center-qa"
          mkdir -p "$ROOT/overlay" "$ROOT/qa/tests" "$ROOT/qa/docs"
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find modules/request-center -type f ! -path '*/tests/*' ! -name '*.pyc' | LC_ALL=C sort)
          files+=(
            index.php
            bootstrap.php
            request-center.php
            actions/ticket-actions.php
            actions/supervisor-actions.php
            actions/bulk-actions.php
            cron/ticket_auto_close.php
          )
          for file in "${files[@]}"; do
            mkdir -p "$ROOT/overlay/$(dirname "$file")"
            cp "$file" "$ROOT/overlay/$file"
          done
          mkdir -p "$ROOT/overlay/tests"
          tests=(
            tests/test_request_center_first_slice_static.py
            tests/test_request_center_repository_sqlite.php
            tests/test_request_center_workflow_service_sqlite.php
            tests/test_request_center_schema_preflight_mariadb.php
            tests/test_request_center_appointments_sqlite.php
            tests/test_request_center_access_matrix_static.py
          )
          for file in "${tests[@]}"; do
            test -s "$file"
            cp "$file" "$ROOT/overlay/tests/"
          done
          cat > "$ROOT/qa/tests/README-FA.txt" <<'EOF'
          آزمون‌های مستقل مرکز درخواست در overlay/tests قرار دارند و از ریشه overlay اجرا می‌شوند.
          آزمون‌های رگرسیون عمومی سامانه در CI مخزن اجرا می‌شوند و در این بستهٔ محدود کپی نشده‌اند.
          EOF
          cp modules/request-center/README.md "$ROOT/qa/docs/REQUEST-CENTER-IMPLEMENTATION.md"
          cp docs/architecture/REQUEST-CENTER-ARCHITECTURE.md "$ROOT/qa/docs/REQUEST-CENTER-ARCHITECTURE.md"
          (
            cd "$ROOT/overlay"
            PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider tests/test_request_center_first_slice_static.py tests/test_request_center_access_matrix_static.py
            php tests/test_request_center_repository_sqlite.php
            php tests/test_request_center_workflow_service_sqlite.php
            php tests/test_request_center_appointments_sqlite.php
            php -l request-center.php
            php -l modules/request-center/Pages/index.php
            php -l modules/request-center/Pages/calendar.php
            php -l modules/request-center/RequestCenterRepository.php
            php -l modules/request-center/WorkflowService.php
            php -l modules/request-center/AppointmentRepository.php
            php -l modules/request-center/Actions/appointment-actions.php
          )
          cat > "$ROOT/README-FA.txt" <<'EOF'
          بستهٔ آزمایشی مرکز درخواست‌ها (Request Center)
          ==============================================
          وضعیت: QA PREVIEW — برای نصب عملیاتی تأیید نشده است.

          این آرشیو یک Overlay از کدهای شاخهٔ توسعه و تست‌های قراردادی مربوط است.
          این بسته نصب‌گر عملیاتی نیست؛ هیچ فایل را روی سامانهٔ زنده کپی نکنید.
          هیچ Migration یا DDL در این بسته اجرا نمی‌شود.
          آزمون‌ها را فقط روی Clone غیرعملیاتی با نسخهٔ سازگار PHP و MariaDB اجرا کنید.

          مسیر overlay نسبت به ریشهٔ مخزن/سامانه حفظ شده است.
          پوشهٔ qa شامل تست‌های قراردادی و توضیح وضعیت پیاده‌سازی است.
          ماژول نوبت‌های رسیدگی و تقویم شمسی (فاز ۳ و ۴) نیز در این Overlay گنجانده شده‌اند.
          Migrationهای 032 تا 035 باید از مسیر runner رسمی اجرا شوند
          (برای نصب تازه: install-empty-db.sql).
          پیش از هر انتشار باید آزمون‌های T01 تا T12، آزمون End-to-End،
          تمرین Backup/Restore و بررسی سازگاری نسخهٔ مقصد تکمیل شوند.
          EOF
          BASE_SHA="ab073ee9fffc56ccd1a2093d02725b95891e0d63"
          HEAD_SHA="$(git rev-parse HEAD)"
          find "$ROOT/overlay" -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          {
            echo "package_kind=request-center-qa-overlay"
            echo "release_status=NOT_FOR_PRODUCTION"
            echo "base_commit=$BASE_SHA"
            echo "head_commit=$HEAD_SHA"
            echo "branch=feature/request-center-module-1.62.88"
            echo "database_ddl_included=no"
            echo "installer_included=no"
            echo "rollback_script_included=no"
            echo "architecture_reference=docs/architecture/REQUEST-CENTER-ARCHITECTURE.md"
            echo "architecture_version=1.14"
            echo "runtime_files:"
            printf ' - %s\n' "${files[@]}"
          } > "$ROOT/PACKAGE-MANIFEST.txt"
          (
            cd "$ROOT"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum
          ) > "$ROOT/SHA256SUMS"
          (
            cd "$ROOT"
            sha256sum -c SHA256SUMS
          )

      - name: Upload QA package preview
        uses: actions/upload-artifact@v4
        with:
          name: request-center-qa-preview
          path: dist/request-center-qa/
          if-no-files-found: error
          retention-days: 14
