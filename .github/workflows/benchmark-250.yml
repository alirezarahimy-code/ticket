name: Isolated 250-VU Benchmark

on:
  push:
    branches:
      - arena/8edbdf95-ticket
    paths:
      - '.github/workflows/benchmark-250.yml'
      - 'tools/benchmark_250.py'
      - 'tools/benchmark_seed.php'
      - 'tools/benchmark_db_report.php'
      - 'index.php'
      - 'bootstrap.php'
      - 'food-ticket.php'
      - 'food-order.php'
      - 'inventory.php'
      - 'schema.sql'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    name: Synthetic application load test (no production traffic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-benchmark-password
          MARIADB_DATABASE: ticket_benchmark
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, ldap, mbstring, xml
          coverage: none

      - name: Initialize the disposable database from schema.sql
        env:
          DB_PASSWORD: ci-only-benchmark-password
        run: |
          set -euo pipefail
          docker_id="$(docker ps --filter ancestor=mariadb:10.11 --format '{{.ID}}' | head -n1)"
          test -n "$docker_id"
          docker exec -i "$docker_id" mariadb -uroot -p"$DB_PASSWORD" ticket_benchmark < schema.sql

      - name: Create temporary app config and 250 synthetic accounts
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: ticket_benchmark
          DB_USER: root
          DB_PASSWORD: ci-only-benchmark-password
        run: |
          set -euo pipefail
          benchmark_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "BENCHMARK_PASSWORD=$benchmark_password" >> "$GITHUB_ENV"
          DB_HOST="$DB_HOST" DB_PORT="$DB_PORT" DB_NAME="$DB_NAME" DB_USER="$DB_USER" DB_PASSWORD="$DB_PASSWORD" BENCHMARK_PASSWORD="$benchmark_password" php tools/benchmark_seed.php

      - name: Run 250 isolated virtual users
        run: python3 tools/benchmark_250.py --vus 250 --ramp-up 30 --duration 90 --think-time 1 --php-workers 32 --output-dir benchmark-results

      - name: Publish benchmark summary in Actions
        if: always()
        run: |
          if [ -f benchmark-results/benchmark-250.md ]; then
            cat benchmark-results/benchmark-250.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark did not produce a report; PHP server log follows.' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 /tmp/ticket-php-benchmark.log >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Capture MariaDB container usage
        if: always()
        run: |
          mkdir -p benchmark-results
          docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' > benchmark-results/container-stats.txt || true

      - name: Upload benchmark report and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-benchmark-250
          path: |
            benchmark-results/
            /tmp/ticket-php-benchmark.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit synthetic benchmark report for remote review
        if: always()
        run: |
          set -euo pipefail
          test -f benchmark-results/benchmark-250.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark-results/benchmark-250.md benchmark-results/benchmark-250.json benchmark-results/container-stats.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record isolated 250-VU benchmark run $GITHUB_RUN_ID"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
