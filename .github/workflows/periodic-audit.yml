name: ممیزی دوره‌ای سامانه

# چرا زمان‌بندی‌شده و نه فقط روی هر push؟
# بعضی پس‌رفت‌ها بدون اینکه کسی کد را عوض کند ظاهر می‌شوند: یک بستهٔ تازه
# منتشر می‌شود و صفحهٔ دانلود عقب می‌ماند، یا شاخه‌ای که لینک‌های تاریخی به
# آن اشاره می‌کنند حذف می‌شود. اجرای هفتگی این‌ها را پیدا می‌کند.
on:
  schedule:
    # هر شنبه ساعت ۰۳:۰۰ UTC
    - cron: "0 3 * * 6"
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: آماده‌سازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: اجرای ممیزی
        id: audit
        run: |
          python3 tools/system_audit.py \
            --markdown audit-report.md \
            --json audit-report.json \
            --check
        continue-on-error: true

      - name: نمایش گزارش در خلاصهٔ اجرا
        if: always()
        run: cat audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: بارگذاری گزارش
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            audit-report.md
            audit-report.json
          retention-days: 90

      # فقط در اجرای زمان‌بندی‌شده issue باز می‌شود. روی PR همان شکست
      # مرحله کافی است و issue ساختن نویز می‌سازد.
      - name: باز کردن issue در صورت پس‌رفت
        if: steps.audit.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('audit-report.md', 'utf8');
            const title = 'ممیزی دوره‌ای: پس‌رفت نسبت به خط مبنا';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit',
            });
            const found = existing.data.find(i => i.title === title);
            const text = body.slice(0, 60000);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body: `اجرای ${new Date().toISOString().slice(0, 10)}\n\n${text}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['audit'],
                body: text,
              });
            }

      - name: اعلام نتیجه
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::ممیزی پس‌رفت پیدا کرد. گزارش را در خلاصهٔ اجرا ببینید."
          exit 1
